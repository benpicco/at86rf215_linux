%YAML 1.2
---
$id: http://devicetree.org/schemas/net/ieee802154/atmel,at86rf215.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip AT86RF215 dual-band IEEE 802.15.4 transceiver

maintainers:
  - Benjamin Valentin <benjamin.valentin@ml-pa.com>

description: |
  The AT86RF215 contains two independent radios with a baseband core each,
  one for the sub-GHz bands (389.5-510 MHz, 779-1020 MHz) and one for the
  2.4 GHz band, that share a single SPI interface and interrupt line.
  The AT86RF215M variant only contains the sub-GHz radio.

properties:
  compatible:
    enum:
      - atmel,at86rf215
      - atmel,at86rf215m

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: GPIO connected to the active-low RSTN pin.

  spi-max-frequency:
    maximum: 25000000

  xtal-trim:
    $ref: /schemas/types.yaml#/definitions/uint8
    maximum: 0xf
    description: |
      Fine tuning of the internal load capacitance of the crystal
      oscillator pins in steps of 0.3 pF:
        0 = +0 pF, 0xf = +4.5 pF

required:
  - compatible
  - reg
  - interrupts

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        ieee802154@0 {
            compatible = "atmel,at86rf215";
            reg = <0>;
            spi-max-frequency = <10000000>;
            interrupt-parent = <&gpio1>;
            interrupts = <12 IRQ_TYPE_LEVEL_HIGH>;
            reset-gpios = <&gpio1 13 GPIO_ACTIVE_LOW>;
            xtal-trim = /bits/ 8 <0x6>;
        };
    };
